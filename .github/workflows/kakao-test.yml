name: KakaoTalk delivery test
on:
  push:
    branches: [codex/kakao-notification]
    paths: [.github/workflows/kakao-test.yml, .github/scripts/send-kakao.py]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send one test message
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python .github/scripts/send-kakao.py
